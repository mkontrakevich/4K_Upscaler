name: 4K Upscaler Regression Guard

on:
  push:
    branches: [main, ui-r8-local-review, ui-r8-single-upload, ui-r8-next-source-plus, fix-container-app-name, ui-r8-log-export, ui-r8-fix-upload-plus-layout, fix-cloud-job-start-generation, fix-container-internal-worker-egress, fix-push-container-jobs, fix-container-job-runner-watchdog, diag-openrouter-generation-failure, fix-review-sync-metadata, fix-review-result-loss-guard, fix-r2-result-sync-buffered, fix-release-processing-slot-on-review, session-history-10min, "restore-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: |
          python -m py_compile v8_safe_appearance.py
          python -m py_compile cloudflare_bridge.py
          python -m py_compile cloud_processor_service.py
          python -m py_compile web_review_server.py
          python -m py_compile safe_local_upscale.py

      - name: Worker syntax
        run: node --check src/worker.js

      - name: Container application naming contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("wrangler.jsonc").read_text(encoding="utf-8"))
          containers = cfg.get("containers") or []
          assert containers, "No Cloudflare Container configured"
          name = containers[0].get("name", "")
          assert name == "mg4k-upscaler-processor"
          assert name[0].isalpha(), "Cloudflare Container application name must start with a letter"
          print("Container application naming contract: PASSED")
          PY

      - name: Container PID1 signal-forwarding contract
        run: |
          python - <<'PY'
          from pathlib import Path
          docker = Path("Dockerfile").read_text(encoding="utf-8")
          assert "libgomp1 tini" in docker
          assert 'ENTRYPOINT ["/usr/bin/tini", "-g", "--"]' in docker
          assert 'CMD ["python", "cloud_processor_service.py"]' in docker
          print("Container PID1 signal-forwarding contract: PASSED")
          PY

      - name: Cloudflare bundle dry-run
        run: |
          npm install
          npm run deploy -- --dry-run --outdir /tmp/mg4k-worker

      - name: Cloud UI inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S|re.I)
          assert scripts, "No inline site script found"
          Path("/tmp/site-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/site-inline.js

      - name: Legacy local web console self-test
        run: python web_review_server.py --self-test

      - name: Existing ARCH LOCK offline checks
        run: |
          python canvas_integrity_self_test.py
          python material_identity_self_test.py
          python source_sky_recovery_self_test.py
          python viewer_inspection_self_test.py
          python retry_budget_self_test.py

      - name: Lock Profile to DONOR prompt contract
        run: |
          python - <<'PY'
          import json, os
          import v8_safe_appearance as v

          os.environ.pop("MG4K_LOCK_PROFILE_JSON", None)
          assert v.donor_generation_prompt() == v.GENERATION_PROMPT, "Legacy local prompt changed"

          profile = {
              "camera": "soft",
              "geometry": "hard",
              "architecture": "hard",
              "textures": "soft",
              "vegetation": "free",
              "people_vehicles": "hard",
              "lighting": "free",
              "sky": "soft",
              "water": "hard",
          }
          os.environ["MG4K_LOCK_PROFILE_JSON"] = json.dumps(profile)
          prompt = v.donor_generation_prompt()
          required = [
              "CAMERA [SOFT]",
              "GEOMETRY [HARD]",
              "ARCHITECTURE [HARD]",
              "TEXTURES / MATERIAL IDENTITY [SOFT]",
              "VEGETATION [FREE]",
              "PEOPLE / VEHICLES / SMALL OBJECTS [HARD]",
              "LIGHTING [FREE]",
              "SKY / CLOUDS [SOFT]",
              "WATER / REFLECTIONS / SHADOWS [HARD]",
              "A FREE parameter grants freedom only to that parameter",
          ]
          missing = [item for item in required if item not in prompt]
          assert not missing, f"Dynamic donor prompt missing: {missing}"
          print("Dynamic DONOR prompt contract: PASSED")
          PY

      - name: Cloud review UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("site/index.html").read_text(encoding="utf-8")
          required = [
              "CORE 8.8.1 R4 · CLOUD UI R10.3",
              'class="comparison"',
              'id="source-image"',
              'id="result-image"',
              'id="lock-list"',
              'id="analysis-panel"',
              'id="check-list"',
              'id="raw-validation"',
              'id="action-approve"',
              'id="action-reject"',
              'id="action-regenerate"',
              'id="viewer"',
              'data-view-mode="side"',
              'data-view-mode="split"',
              'data-view-mode="diff"',
              'data-view-mode="blink"',
              'data-zoom="0.5">50%',
              'data-zoom="1">100%',
              'data-zoom="2">200%',
              'id="viewer-sync"',
              'id="viewer-defects"',
              'data-diff-mode="absolute"',
              'data-diff-mode="edge"',
              'data-diff-mode="heatmap"',
              'data-inspection-engine="local-v8.8.1"',
              "drawInspection",
              "buildDiff",
              "renderValidation",
              "sendDecision",
              "confirmPaidGeneration",
          ]
          missing = [item for item in required if item not in html]
          assert not missing, f"Review UI regression: {missing}"
          assert html.index('id="source-image"') < html.index('id="result-image"'), "SOURCE must precede RESULT"
          assert "Подключить процессор" not in html, "Cloud UI must not require local processor pairing"
          assert html.count('id="upload-plus"') == 1, "Exactly one upload control is required"
          for obsolete in ['id="pick-file"', 'id="pick-cloud"', 'id="replace-file"', 'id="mobile-file"']:
              assert obsolete not in html, f"Duplicate upload control remains: {obsolete}"
          assert '$("upload-plus").addEventListener("click",()=>openPicker("add"));' in html, "Initial upload plus must open the add picker"
          assert '$("upload-plus").classList.add("hidden")' in html, "Initial plus must disappear after a source is loaded"
          for required_nav in ['id="action-prev"', 'id="action-add"', 'id="action-next"', 'id="action-skip"', 'id="action-replace-source"']:
              assert required_nav in html, f"Missing source navigation control: {required_nav}"
          assert '$("action-add").addEventListener("click",()=>openPicker("add"));' in html, "Add-file navigation must open the add picker"
          assert '$("action-replace-source").addEventListener("click",()=>openPicker("replace"));' in html, "Replace-source action must open the replacement picker"
          assert 'status==="skipped"' in html, "Skipped source state must remain reviewable"
          assert 'sendDecision("skip")' in html, "Skip action must be wired"
          assert 'Добавить следующий исходник' not in html, "Source addition must live in the navigation, not on the preview"
          for log_control in ['id="log-copy"', 'id="log-save"', "function logExportText()", "function copyProcessLog()", "function saveProcessLog()"]:
              assert log_control in html, f"Missing process log export control: {log_control}"
          assert 'MG4K_LOG_' in html, "Saved log filename contract missing"
          assert '"Processor build: "+(latestJobState?.container_build_id||"—")' in html, "Processor build must be exported in logs"
          assert '.upload-plus{position:static' in html, "Initial upload plus must stay in document flow"
          plus_pos = html.index('id="upload-plus"')
          overlay_pos = html.rfind('id="upload-overlay"', 0, plus_pos)
          overlay_close = html.index('</div>\n        </div>', plus_pos)
          assert overlay_pos != -1 and overlay_close != -1, "Upload plus must stay inside upload overlay content"
          print("Cloud two-pane Visual Review + queue/skip + log export + upload layout contract: PASSED")
          PY

      - name: Operator recovery controls contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("site/index.html").read_text(encoding="utf-8")
          worker = Path("src/worker.js").read_text(encoding="utf-8")

          for token in [
              'id="action-refresh"',
              'id="action-reset-job"',
              'id="action-reload-source"',
              'id="action-replace-source"',
              "async function refreshCurrentJob()",
              "async function resetCurrentJob",
              "async function reloadCurrentSource()",
              "async function replaceCurrentSource(file",
              'fetch("/api/jobs/"+job.id+"/reset"',
              "платный API не запускался",
          ]:
              assert token in html, token

          replace_block = html[html.index("async function replaceCurrentSource(file"):html.index("async function prepareJob", html.index("async function replaceCurrentSource(file"))]
          assert "const item=currentSourceItem()" in replace_block
          assert "sourceItems.push(" not in replace_block, "Replacement must mutate the current queue slot, not append a new source"
          assert "item.file=file" in replace_block
          assert "item.job=null" in replace_block and "currentJob=null" in replace_block
          assert "item.locks=preservedLocks" in replace_block and "locks={...preservedLocks}" in replace_block
          assert 'fetch("/api/jobs"' not in replace_block, "Replacement must not create a paid-generation job"
          assert "prepareJob(" not in replace_block, "Replacement must wait for an explicit operator launch"
          assert "платный API не запускался" in replace_block

          assert "function processorContainerForJob(env, job)" in worker
          assert "container_owner_unavailable:" in worker
          assert "jobResetMatch" in worker
          assert "job_busy_cannot_reset" in worker
          assert 'job.stage = "operator_reset";' in worker
          assert "job.container_dispatched = false;" in worker

          reset_block = worker[worker.index("const jobResetMatch"):worker.index("const jobSourceMatch")]
          assert '["queued", "processing", "decision_pending"].includes(status)' in reset_block
          assert 'status === "review"' in reset_block
          assert 'sendContainerDecision(env, job, "skip").catch' in reset_block

          decision = worker[worker.index("async function sendContainerDecision"):worker.index("MG4KProcessor.outboundByHost")]
          assert "processorContainerForJob(env, job)" in decision
          print("Operator reset / refresh / source reload controls: PASSED")
          PY

      - name: Cloud double-click image preview contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("site/index.html").read_text(encoding="utf-8")
          required = [
              "CORE 8.8.1 R4 · CLOUD UI R10.3",
              'id="quick-preview"',
              'data-preview-engine="native-image-v1"',
              'id="quick-preview-image"',
              'function openQuickPreview(kind)',
              '$("source-image").addEventListener("dblclick"',
              '$("result-image").addEventListener("dblclick"',
              'function toggleQuickPreviewScale()',
              'quick-preview-stage',
          ]
          missing=[x for x in required if x not in html]
          assert not missing, f"Double-click image preview contract missing: {missing}"
          block=html[html.index("// ----- Quick image preview"):html.index("// ----- Inspection viewer")]
          assert "prepareJob(" not in block, "Quick preview must not trigger generation"
          assert 'fetch("/api/jobs"' not in block, "Quick preview must not create jobs"
          assert "sendDecision(" not in block, "Quick preview must not change review decisions"
          print("Cloud double-click image preview contract: PASSED")
          PY

      - name: Cloud AI scene analysis / dynamic LOCK contract
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path("site/index.html").read_text(encoding="utf-8")
          worker=Path("src/worker.js").read_text(encoding="utf-8")

          for token in [
              'CLOUD UI R10.3',
              'id="scene-analyze"',
              'id="scene-show-all"',
              'const extendedLocks=[',
              'async function analyzeCurrentSource(force=false)',
              'fetch("/api/scene-analysis"',
              'function applySceneAnalysis(data',
              'function visibleLockItems()',
              'function promptLockItems()',
              'let manualLockIds=new Set();',
          ]:
              assert token in ui, token

          for token in [
              'const SCENE_LOCK_CATALOG = [',
              'google/gemini-3.8-flash',
              'function sceneAnalysisPrompt()',
              'async function analyzeSceneWithOpenRouter(env, file)',
              'path === "/api/scene-analysis"',
              'response_format:{type:"json_schema"',
              'scene_analysis_enabled',
          ]:
              assert token in worker, token

          # Show-all is display-only: hidden irrelevant controls do not silently
          # enter the provider prompt until the operator actually changes one.
          show_all=ui[ui.index('$("scene-show-all").addEventListener'):ui.index('$("reset-locks").addEventListener')]
          assert "syncPromptFromLocks" not in show_all, show_all
          assert "manualLockIds.add(id)" in ui

          # Scene analysis is a vision call only; it must never create /api/jobs.
          block=ui[ui.index("async function analyzeCurrentSource"):ui.index("function renderLocks()", ui.index("async function analyzeCurrentSource"))]
          assert 'fetch("/api/jobs"' not in block
          assert "prepareJob(" not in block

          # CI never performs the paid OpenRouter analysis request.
          print("AI scene analysis / dynamic LOCK contract: PASSED")
          PY

      - name: Cloud editable prompt and presets contract
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path("site/index.html").read_text(encoding="utf-8")
          worker=Path("src/worker.js").read_text(encoding="utf-8")
          service=Path("cloud_processor_service.py").read_text(encoding="utf-8")
          bridge=Path("cloudflare_bridge.py").read_text(encoding="utf-8")
          pipeline=Path("v8_safe_appearance.py").read_text(encoding="utf-8")

          for token in [
              'CLOUD UI R10.3',
              'id="prompt-editor"',
              'id="prompt-presets"',
              'id="additions-editor"',
              'id="custom-locks"',
              'function buildPromptFromLocks()',
              'function savePromptPreset()',
              'function deletePromptPreset(id)',
              'function saveCustomLock()',
              'function overwriteCustomLock()',
              'function deleteCustomLock(id)',
              'USER ADDITIONS — REQUESTED CREATIVE CHANGES.',
              'form.append("prompt",currentPrompt)',
              'PROMPT SENT TO GENERATOR',
          ]:
              assert token in ui, token

          for token in [
              'form.get("prompt")',
              'x-mg4k-prompt-b64',
              'prompt_override: job.prompt_override || null',
              'prompt_sha256',
          ]:
              assert token in worker, token

          assert 'x-mg4k-prompt-b64' in service
          assert '"prompt_override": prompt_override or None' in service
          assert 'MG4K_PROMPT_OVERRIDE' in bridge
          assert 'def generation_request_prompt(' in pipeline
          assert 'MG4K_PROMPT_OVERRIDE' in pipeline
          assert 'usage["prompt_sha256"]' in pipeline
          assert "The LOCK PROFILE has higher priority" in ui
          assert "localStorage.setItem(CUSTOM_LOCK_BUTTONS_KEY" in ui
          print("Editable prompt / custom LOCK buttons contract: PASSED")
          PY

      - name: Cloud Prompt AI Assistant contract
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path("site/index.html").read_text(encoding="utf-8")
          worker=Path("src/worker.js").read_text(encoding="utf-8")
          assistant=Path("src/prompt_assistant.js").read_text(encoding="utf-8")

          for token in [
              'CLOUD UI R10.3',
              'id="prompt-assistant-input"',
              'id="prompt-assistant-run"',
              'PROMPT_QUICK_COMMANDS',
              'Выровнять архитектуру',
              'function applyAssistantLocks()',
              'function applyAssistantAdditions()',
              'function applyAssistantAll()',
              'function applyAssistantFinal()',
              '/api/prompt-assistant',
          ]:
              assert token in ui or token in worker, token

          for token in [
              'promptAssistantEnabled',
              'consumePromptAssistantBudget',
              'sanitizeAssistantContext',
              'runPromptAssistant',
              'MG4K_PROMPT_ASSISTANT_ERROR',
          ]:
              assert token in worker, token

          for token in [
              'ARCHITECTURAL PERSPECTIVE',
              'camera=soft',
              'geometry=hard',
              'architecture=hard',
              'suggested_additions',
              'suggested_final_prompt',
              'recommended_lock_changes',
          ]:
              assert token in assistant, token

          assert 'OPENROUTER_API_KEY' not in ui
          print("Cloud Prompt AI Assistant contract: PASSED")
          PY

      - name: Cloud backend diagnostics / clean user UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path("site/index.html").read_text(encoding="utf-8")
          worker=Path("src/worker.js").read_text(encoding="utf-8")
          service=Path("cloud_processor_service.py").read_text(encoding="utf-8")

          for forbidden in [
              'id="debug-panel"',
              'function runDebuggerHealth(',
              'id="debug-health"',
              'id="debug-copy"',
              'id="debug-save"',
              'MG4K_DEBUG_',
          ]:
              assert forbidden not in ui, forbidden

          for token in [
              'CLOUD UI R10.3',
              'function diagnosticPayload(',
              'PROVIDER_REGION_BLOCKED',
              'Diagnostic code:',
              'PROCESS LOG',
          ]:
              assert token in ui, token

          for token in [
              'def _classify_failure(',
              'PROVIDER_REGION_BLOCKED',
              'diagnostic_routing_step',
              'diagnostic_http_status',
          ]:
              assert token in service, token

          for token in [
              'diagnostic_code: job.diagnostic_code || null',
              'diagnostic_routing_step: job.diagnostic_routing_step || null',
              'state.diagnostic_code',
          ]:
              assert token in worker, token

          assert 'OPENROUTER_KEY_REDACTED' in service
