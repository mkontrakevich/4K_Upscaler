          assert 'async function sendContainerDecision' in worker
          assert 'http://container/jobs/${job.id}/start' in worker
          assert 'http://container/jobs/${job.id}/status' in worker
          assert 'http://container/jobs/${job.id}/result' in worker
          assert 'http://container/jobs/${job.id}/decision' in worker
          assert '"processor_ready_waiting_claim"' in worker, "Old 8% jobs must be recoverable"
          assert 'await dispatchJobToContainer(env, starting, url.origin);' in worker
          assert 'job = await syncJobFromContainer(env, job, url.origin);' in worker

          assert 'worker-push-runner-watchdog' in service
          assert 'queue.Queue' not in service
          assert 'def _process_job(job_id: str)' in service
          assert 'def _runner_entry(job_id: str)' in service
          assert 'def _ensure_job_runner(job_id: str)' in service
          assert 'daemon=False' in service
          assert '_PROCESSING_LOCK' in service
          assert 'if state.get("status") == "queued":' in service
