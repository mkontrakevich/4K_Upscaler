name: 4K Upscaler Regression Guard

on:
  push:
    branches: [main, ui-r8-local-review, ui-r8-single-upload, ui-r8-next-source-plus, fix-container-app-name, ui-r8-log-export, ui-r8-fix-upload-plus-layout, fix-cloud-job-start-generation, fix-container-internal-worker-egress, fix-push-container-jobs, fix-container-job-runner-watchdog, diag-openrouter-generation-failure, fix-review-sync-metadata, fix-review-result-loss-guard, fix-r2-result-sync-buffered, fix-release-processing-slot-on-review, session-history-10min]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: |
          python -m py_compile v8_safe_appearance.py
          python -m py_compile cloudflare_bridge.py
          python -m py_compile cloud_processor_service.py
          python -m py_compile web_review_server.py
          python -m py_compile safe_local_upscale.py

      - name: Worker syntax
        run: node --check src/worker.js

      - name: Container application naming contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("wrangler.jsonc").read_text(encoding="utf-8"))
          containers = cfg.get("containers") or []
          assert containers, "No Cloudflare Container configured"
          name = containers[0].get("name", "")
          assert name == "mg4k-upscaler-processor"
          assert name[0].isalpha(), "Cloudflare Container application name must start with a letter"
          print("Container application naming contract: PASSED")
          PY

      - name: Cloudflare bundle dry-run
        run: |
          npm install
          npm run deploy -- --dry-run --outdir /tmp/mg4k-worker

      - name: Cloud UI inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S|re.I)
          assert scripts, "No inline site script found"
          Path("/tmp/site-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/site-inline.js

      - name: Legacy local web console self-test
        run: python web_review_server.py --self-test

      - name: Existing ARCH LOCK offline checks
        run: |
          python canvas_integrity_self_test.py
          python material_identity_self_test.py
          python source_sky_recovery_self_test.py
          python viewer_inspection_self_test.py
          python retry_budget_self_test.py

      - name: Lock Profile to DONOR prompt contract
        run: |
          python - <<'PY'
          import json, os
          import v8_safe_appearance as v

          os.environ.pop("MG4K_LOCK_PROFILE_JSON", None)
          assert v.donor_generation_prompt() == v.GENERATION_PROMPT, "Legacy local prompt changed"

          profile = {
              "camera": "soft",
              "geometry": "hard",
              "architecture": "hard",
              "textures": "soft",
              "vegetation": "free",
              "people_vehicles": "hard",
              "lighting": "free",
              "sky": "soft",
              "water": "hard",
          }
          os.environ["MG4K_LOCK_PROFILE_JSON"] = json.dumps(profile)
          prompt = v.donor_generation_prompt()
          required = [
              "CAMERA [SOFT]",
              "GEOMETRY [HARD]",
              "ARCHITECTURE [HARD]",
              "TEXTURES / MATERIAL IDENTITY [SOFT]",
              "VEGETATION [FREE]",
              "PEOPLE / VEHICLES / SMALL OBJECTS [HARD]",
              "LIGHTING [FREE]",
              "SKY / CLOUDS [SOFT]",
              "WATER / REFLECTIONS / SHADOWS [HARD]",
              "A FREE parameter grants freedom only to that parameter",
          ]
          missing = [item for item in required if item not in prompt]
          assert not missing, f"Dynamic donor prompt missing: {missing}"
          print("Dynamic DONOR prompt contract: PASSED")
          PY

      - name: Cloud review UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("site/index.html").read_text(encoding="utf-8")
          required = [
              "CORE 8.8.1 R4 · CLOUD UI R9",
              'class="comparison"',
              'id="source-image"',
              'id="result-image"',
              'id="lock-list"',
              'id="analysis-panel"',
              'id="check-list"',
              'id="raw-validation"',
              'id="action-approve"',
              'id="action-reject"',
              'id="action-regenerate"',
              'id="viewer"',
              'data-view="side"',
              'data-view="split"',
              'data-view="diff"',
              'data-view="blink"',
              'data-zoom="0.5">50%',
              'data-zoom="1">100%',
              'data-zoom="2">200%',
              'id="viewer-divider"',
              'id="viewer-sync"',
              'id="viewer-defects"',
              'data-diff="absolute"',
              'data-diff="edge"',
              'data-diff="heatmap"',
              "viewerPointerMove",
              "viewerWheel",
              "renderValidation",
              "sendDecision",
              "confirmPaidGeneration",
          ]
          missing = [item for item in required if item not in html]
          assert not missing, f"Review UI regression: {missing}"
          assert html.index('id="source-image"') < html.index('id="result-image"'), "SOURCE must precede RESULT"
          assert "Подключить процессор" not in html, "Cloud UI must not require local processor pairing"
          assert html.count('id="upload-plus"') == 1, "Exactly one upload control is required"
          for obsolete in ['id="pick-file"', 'id="pick-cloud"', 'id="replace-file"', 'id="mobile-file"']:
              assert obsolete not in html, f"Duplicate upload control remains: {obsolete}"
          assert '$("upload-plus").addEventListener("click",openPicker);' in html, "Initial upload plus must open the picker"
          assert '$("upload-plus").classList.add("hidden")' in html, "Initial plus must disappear after a source is loaded"
          for required_nav in ['id="action-prev"', 'id="action-add"', 'id="action-next"', 'id="action-skip"']:
              assert required_nav in html, f"Missing source navigation control: {required_nav}"
          assert '$("action-add").addEventListener("click",openPicker);' in html, "Add-file navigation must open the picker"
          assert 'status==="skipped"' in html, "Skipped source state must remain reviewable"
          assert 'sendDecision("skip")' in html, "Skip action must be wired"
          assert 'Добавить следующий исходник' not in html, "Source addition must live in the navigation, not on the preview"
          for log_control in ['id="log-copy"', 'id="log-save"', "function logExportText()", "function copyProcessLog()", "function saveProcessLog()"]:
              assert log_control in html, f"Missing process log export control: {log_control}"
          assert 'MG4K_LOG_' in html, "Saved log filename contract missing"
          assert '.upload-plus{position:static' in html, "Initial upload plus must stay in document flow"
          plus_pos = html.index('id="upload-plus"')
          overlay_pos = html.rfind('id="upload-overlay"', 0, plus_pos)
          overlay_close = html.index('</div>\n        </div>', plus_pos)
          assert overlay_pos != -1 and overlay_close != -1, "Upload plus must stay inside upload overlay content"
          print("Cloud two-pane Visual Review + queue/skip + log export + upload layout contract: PASSED")
          PY

      - name: Cloud skip backend contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("src/worker.js").read_text(encoding="utf-8")
          bridge = Path("cloudflare_bridge.py").read_text(encoding="utf-8")
          service = Path("cloud_processor_service.py").read_text(encoding="utf-8")
          assert '["approve", "reject", "skip"]' in worker
          assert '"skip_sent"' in worker
          assert '{"approve", "reject", "skip"}' in bridge
          assert '"skipped_by_user"' in bridge
          assert '"status": "skipped"' in bridge
          assert '{"approve", "reject", "skip"}' in service
          assert 'status="skipped"' in service
          assert 'sendContainerDecision' in worker
          print("Cloud skip backend contract: PASSED")
          PY

      - name: Cloud push processor contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("src/worker.js").read_text(encoding="utf-8")
          service = Path("cloud_processor_service.py").read_text(encoding="utf-8")
          ui = Path("site/index.html").read_text(encoding="utf-8")
          package = Path("package.json").read_text(encoding="utf-8")

          assert '@cloudflare/containers": "0.3.7"' in package
          assert 'async function dispatchJobToContainer' in worker
          assert 'async function syncJobFromContainer' in worker
          assert 'async function sendContainerDecision' in worker
          assert 'http://container/jobs/${job.id}/start' in worker
          assert 'http://container/jobs/${job.id}/status' in worker
          assert 'http://container/jobs/${job.id}/result' in worker
          assert 'http://container/jobs/${job.id}/decision' in worker
          assert '"processor_ready_waiting_claim"' in worker, "Old 8% jobs must be recoverable"
          assert 'await dispatchJobToContainer(env, starting, url.origin);' in worker
          assert 'job = await syncJobFromContainer(env, job, url.origin);' in worker

          assert 'worker-push-runner-watchdog' in service
          assert 'queue.Queue' not in service
          assert 'def _process_job(job_id: str)' in service
          assert 'def _runner_entry(job_id: str)' in service
          assert 'def _ensure_job_runner(job_id: str)' in service
          assert 'daemon=False' in service
          assert '_PROCESSING_LOCK' in service
          assert 'if state.get("status") == "queued":' in service
          assert '_ensure_job_runner(job_id)' in service
          assert 'self._job_id("start")' in service
          assert 'self._job_id("status")' in service
          assert 'self._job_id("result")' in service
          assert 'self._job_id("decision")' in service
          assert 'cloudflare_bridge.main()' not in service

          prep = service.index('bridge.run_pipeline(["--limit", "1"], env, log_file)')
          paid = service.index('"--auto-generate-current"', prep)
          assert prep < paid, "Non-paid V8.8.1 preparation must precede paid generation"
          assert 'AWAITING_EXPLICIT_DONOR_GENERATION' in service

          assert 'latestJobState=state;' in ui
          assert 'signature!==lastStatusSignature' in ui
          assert '"Stage: "+(latestJobState?.stage||"—")' in ui
          print("Cloud push processor + V8.8.1 sequencing contract: PASSED")
          PY

      - name: Container job runner watchdog smoke test
        run: |
          python - <<'PY'
          import os, tempfile, time
          root = tempfile.mkdtemp(prefix="mg4k-runner-")
          os.environ["MG4K_JOBS_ROOT"] = root
          import cloud_processor_service as svc

          observed = []
          def fake_process(job_id):
              observed.append(job_id)
              svc._set_state(job_id, status="processing", stage="fake_processing", progress=20)

          svc._process_job = fake_process
          svc._JOBS["job-watchdog"] = {
              "id": "job-watchdog",
              "status": "queued",
              "stage": "container_job_received",
              "progress": 10,
          }
          assert svc._ensure_job_runner("job-watchdog") is True
          deadline = time.time() + 5
          while time.time() < deadline:
              state = svc._public_state("job-watchdog")
              if state and state["stage"] == "fake_processing":
                  break
              time.sleep(0.05)
          state = svc._public_state("job-watchdog")
          assert observed == ["job-watchdog"], observed
          assert state["status"] == "processing", state
          assert state["stage"] == "fake_processing", state
          print("Container job runner watchdog: PASSED")
          PY

      - name: Sanitized cloud diagnostics contract
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          os.environ["MG4K_JOBS_ROOT"] = tempfile.mkdtemp(prefix="mg4k-diag-")
          import cloud_processor_service as svc

          p = Path(os.environ["MG4K_JOBS_ROOT"]) / "pipeline.log"
          p.write_text(
              "Authorization: Bearer secret-token\n"
              "key=sk-or-v1-THIS_MUST_NOT_LEAK\n"
              "image=data:image/png;base64,QUJDREVGRw==\n"
              "nano_banana_generation HTTP 429: provider rate limited\n",
              encoding="utf-8",
          )
          tail = svc._safe_pipeline_tail(p)
          assert "THIS_MUST_NOT_LEAK" not in tail
          assert "secret-token" not in tail
          assert "QUJDREVGRw==" not in tail
          assert "<OPENROUTER_KEY_REDACTED>" in tail
          assert "HTTP 429" in tail

          worker = Path("src/worker.js").read_text(encoding="utf-8")
          ui = Path("site/index.html").read_text(encoding="utf-8")
          assert "diagnostic_excerpt" in worker
          assert '"Diagnostic: "+(latestJobState?.diagnostic_excerpt||"—")' in ui
          assert 'Диагностика pipeline:' in ui
          print("Sanitized cloud diagnostics: PASSED")
          PY

      - name: Review sync metadata contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("src/worker.js").read_text(encoding="utf-8")
          bridge = Path("cloudflare_bridge.py").read_text(encoding="utf-8")
          ui = Path("site/index.html").read_text(encoding="utf-8")

          assert 'await writeJob(env, job);\n\n  if (state.result_available' in worker
          assert 'job.stage = "result_sync_retry";' in worker
          assert 'container_review_status' in worker
          assert 'result_sync_warning' in worker
          assert 'if (!["review", "done"].includes(job.status))' in worker

          assert 'fallback_from_pipeline_state' in bridge
          assert 'mandatory_failures' in bridge
          assert 'technical_decision' in bridge
          assert 'source_state' in bridge

          assert 'if(!state.result_available)' in ui
          assert 'ARCH LOCK завершён. Синхронизирую RESULT' in ui
          assert 'RESULT сформирован. Повторяю синхронизацию в R2' in ui
          print("Review sync metadata contract: PASSED")
          PY

      - name: Paid redispatch safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("src/worker.js").read_text(encoding="utf-8")
          ui = Path("site/index.html").read_text(encoding="utf-8")

          assert 'const preDispatchStages = new Set([' in worker
          assert 'const needsDispatch = job.status === "queued"' in worker
          assert '"result_lost_after_container_restart"' in worker
          assert '"manual_retry_required"' in worker
          assert 'Automatic regeneration was blocked to prevent a duplicate paid API call.' in worker
          assert 'Automatic redispatch was blocked to prevent an unintended paid API call.' in worker
          assert 'manual_retry_required: Boolean(job.manual_retry_required)' in worker

          assert 'RESULT был сформирован, но временный Container перезапустился' in ui
          assert 'Автоповтор заблокирован' in ui
          assert 'Регенерировать вручную' in ui
          print("Paid redispatch safety contract: PASSED")
          PY

      - name: Buffered RESULT sync contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("src/worker.js").read_text(encoding="utf-8")
          ui = Path("site/index.html").read_text(encoding="utf-8")

          assert 'const bytes = await response.arrayBuffer();' in worker
          assert 'container_result_empty' in worker
          assert 'container_result_size_mismatch' in worker
          assert 'result_sync_attempts' in worker
          assert 'job.result_sync_attempts >= 5' in worker
          assert 'stage = "result_sync_failed"' in worker
          assert 'Paid regeneration was not started.' in worker
          assert 'result_bytes' in worker
          assert 'result_content_type' in worker

          assert 'Result sync attempts:' in ui
          assert 'Result sync warning:' in ui
          assert 'Result bytes:' in ui
          assert 'Result content type:' in ui
          assert 'startsWith("REJECTED")' in ui
          assert 'утверждение заблокировано' in ui
          assert 'result_sync_failed' in ui
          print("Buffered RESULT sync + rejected review contract: PASSED")
          PY

      - name: Human review releases processing slot
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("cloud_processor_service.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          funcs = {n.name: n for n in tree.body if isinstance(n, ast.FunctionDef)}
          process = funcs["_process_job"]
          runner = funcs["_runner_entry"]

          def lock_with_nodes(fn):
              out = []
              for node in ast.walk(fn):
                  if not isinstance(node, ast.With):
                      continue
                  text = ast.get_source_segment(source, node.items[0].context_expr) or ""
                  if "_PROCESSING_LOCK" in text:
                      out.append(node)
              return out

          process_locks = lock_with_nodes(process)
          runner_locks = lock_with_nodes(runner)
          assert not runner_locks, "_runner_entry must never own the processing slot for the full job lifecycle"
          assert len(process_locks) >= 3, "Expected compute, reject and approve processing-slot sections"

          wait_calls = [
              node for node in ast.walk(process)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "_wait_for_decision"
          ]
          assert len(wait_calls) == 1
          wait_line = wait_calls[0].lineno
          assert all(not (node.lineno <= wait_line <= node.end_lineno) for node in process_locks),               "Human review wait must be outside every processing lock"

          source_received = source.index('stage="source_received"')
          waiting_slot = source.index('stage="waiting_for_processing_slot"')
          decision = source.index('decision = _wait_for_decision(job_id)')
          approve_wait = source.index('stage="operator_approve_waiting_slot"')
          reject_wait = source.index('stage="operator_reject_waiting_slot"')
          assert waiting_slot < source_received < decision
          assert decision < reject_wait and decision < approve_wait
          assert '"processing_slot_locked": _PROCESSING_LOCK.locked()' in source
          print("Human review processing-slot release contract: PASSED")
          PY

      - name: 10-minute refresh history contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("src/worker.js").read_text(encoding="utf-8")
          ui = Path("site/index.html").read_text(encoding="utf-8")

          assert "const SESSION_TTL = 60 * 10;" in worker
          assert 'const jobSourceMatch = path.match(/^\\/api\\/jobs\\/([0-9a-f-]+)\\/source$/i);' in worker
          assert 'if (!await authorizeJob(request, url, job))' in worker
          assert 'env.TEMP_BUFFER_R7.get(job.source_key)' in worker

          assert 'const HISTORY_TTL_MS=10*60*1000;' in ui
          assert 'sessionStorage.setItem(HISTORY_KEY' in ui
          assert 'sessionStorage.getItem(HISTORY_KEY)' in ui
          assert 'async function restoreSessionHistory()' in ui
          assert 'new File([blob]' in ui
          assert 'await selectSource(index);' in ui
          assert 'window.addEventListener("pagehide",()=>persistSessionHistory())' in ui
          assert 'История восстановлена после обновления страницы. Хранение — 10 минут.' in ui
          assert 'window.addEventListener("pagehide",finishCloudSession)' not in ui
          print("10-minute refresh history contract: PASSED")
          PY

      - name: V8.8.1 first-pass state preparation smoke test
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          from PIL import Image

          root = Path(tempfile.mkdtemp(prefix="mg4k-prep-"))
          Image.new("RGB", (1280, 720), (96, 110, 125)).save(root / "source.jpg", quality=95)

          env = os.environ.copy()
          env["MG4K_SOURCE"] = str(root)
          env.pop("OPENROUTER_API_KEY", None)

          proc = subprocess.run(
              [sys.executable, "v8_safe_appearance.py", "--limit", "1"],
              env=env,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              timeout=120,
          )
          assert proc.returncode == 5, f"Expected donor-wait exit 5, got {proc.returncode}\n{proc.stdout[-4000:]}"

          # Import with the same source override only after the subprocess completed.
          os.environ["MG4K_SOURCE"] = str(root)
          import v8_safe_appearance as v
          state = json.loads(v.sequential_state_path().read_text(encoding="utf-8"))
          assert state["active"]["status"] == "AWAITING_EXPLICIT_DONOR_GENERATION", state["active"]
          assert not list((root / v.CFG["output_folder"] / "02_NANO_BANANA_PRO_RAW").glob("*")), "No paid/raw generation is allowed in preparation"
          print("V8.8.1 non-paid state preparation: PASSED")
          PY

      - name: No paid generation in regression
        run: |
          echo "Regression suite uses only offline/self-test paths; no OPENROUTER_API_KEY is provided."
