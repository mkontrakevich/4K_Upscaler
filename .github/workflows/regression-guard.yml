          assert "credit_ledger" in schema
          assert "credit_reservations" in schema
          assert "generation_costs" in schema
          assert '"BILLING_MODE": "off"' in wrangler
          assert "CLOUDPAYMENTS_API_SECRET" not in ui
          assert "BILLING_PERMIT_HMAC_SECRET" not in ui
