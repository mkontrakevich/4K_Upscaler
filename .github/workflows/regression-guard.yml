      - name: Cloud commercial credit gate contract
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path("site/index.html").read_text(encoding="utf-8")
          worker=Path("src/worker.js").read_text(encoding="utf-8")
          gateway=Path("billing-gateway/server.mjs").read_text(encoding="utf-8")
          schema=Path("billing/schema.postgresql.sql").read_text(encoding="utf-8")
