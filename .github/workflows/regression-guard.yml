          import json, sys
          d=json.load(open(sys.argv[1]))
          assert d.get("worker_build_id") == "pid1-tini-r11b", d
          assert d.get("processor_build_expected") == "result-persist-r11b", d
          assert d.get("processor_instance_expected") == "primary-result-persist-r11b", d
          assert d.get("processor_lifecycle") == "tini-pid1-group-forwarding", d
          assert "scene_analysis_enabled" in d, d
          assert "scene_analysis_model" in d, d
          billing=json.load(open(sys.argv[2]))
          assert billing.get("mode") == "off", billing
          assert billing.get("enabled") is False, billing
          PY
            then
              STABLE=$((STABLE+1))
              if [[ "$STABLE" -ge 3 ]]; then
                echo "Production preflight PASSED: UI R10.3 · AI scene LOCK analysis · editable prompt/custom LOCK buttons · Prompt AI Assistant · debugger/diagnostics · billing safely OFF · double-click preview · local V8.8.1 inspection · save-result · replace-source · Worker pid1-tini-r11b · expected processor result-persist-r11b"
                exit 0
              fi
            else
              STABLE=0
            fi

            sleep 10
          done

          echo "Production did not converge to the expected R10.3/R11b contract." >&2
          cat "$TMP/health.json" >&2 || true
          exit 1


  live_r11b_smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-r11b]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Live production R11b smoke
        env:
          BASE_URL: https://4k-upscaler.kontrakevich.workers.dev
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          test -f UI_REFERENCE_APPROVED_V875.png
          cp UI_REFERENCE_APPROVED_V875.png "$TMP/live_architecture_source.png"
          LOCKS='{"camera":"hard","geometry":"hard","architecture":"hard","textures":"hard","vegetation":"hard","people_vehicles":"hard","lighting":"free","sky":"free","water":"soft"}'

          # No paid work is allowed until the public Worker serves the intended UI.
          for attempt in $(seq 1 18); do
            curl -fsS --retry 2 --retry-delay 2 "$BASE_URL/?smoke=$GITHUB_SHA-$attempt" > "$TMP/root.html"
            if grep -q 'CLOUD UI R10.3' "$TMP/root.html" && grep -q 'id="action-replace-source"' "$TMP/root.html" && grep -q 'data-inspection-engine="local-v8.8.1"' "$TMP/root.html" && grep -q 'id="action-save-result"' "$TMP/root.html" && grep -q 'data-preview-engine="native-image-v1"' "$TMP/root.html"; then
              break
            fi
            if [[ "$attempt" == "18" ]]; then
              echo "Production UI is not R10.3 / replace-source yet; aborting before paid generation." >&2
              exit 20
            fi
            sleep 10
          done
          echo "Production UI R10.3 + double-click preview + local V8.8.1 inspection + save-result + replace-source: PASSED"

          # Wait for the Worker durability fix itself before any paid generation.
          WORKER_BUILD=""
          for attempt in $(seq 1 24); do
            curl -fsS --retry 2 --retry-delay 2 "$BASE_URL/api/health?smoke=$GITHUB_SHA-$attempt" > "$TMP/health.json"
            WORKER_BUILD="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("worker_build_id",""))' "$TMP/health.json")"
            if [[ "$WORKER_BUILD" == "pid1-tini-r11b" ]]; then
              break
            fi
            if [[ "$attempt" == "24" ]]; then
              echo "Production Worker is not pid1-tini-r11b; aborting before paid generation." >&2
              exit 24
            fi
            sleep 10
          done
          echo "Production Worker durability build: $WORKER_BUILD"

          # Guard the smoke input against the service-asset exclusion policy.
          python - "$TMP/live_architecture_source.png" <<'PY'
          import sys
          from pathlib import Path
          from source_queue_policy import is_source_candidate
          p=Path(sys.argv[1])
          assert is_source_candidate(p, p.parent, "GEN_QUALITY_ARCH_LOCK_V8"), p
          print("Smoke source queue admission: PASSED")
          PY

          curl -fsS --retry 3 --retry-delay 2 -X POST "$BASE_URL/api/session/start" > "$TMP/session.json"
          SESSION_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$TMP/session.json")"
          SESSION_TOKEN="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$TMP/session.json")"

          curl -fsS --retry 2 --retry-delay 2 -X POST "$BASE_URL/api/jobs"             -H "X-Session-Id: $SESSION_ID"             -H "X-Session-Token: $SESSION_TOKEN"             -F "file=@$TMP/live_architecture_source.png;type=image/png"             -F "locks=$LOCKS"             -F "mode=generative" > "$TMP/job.json"

          JOB_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$TMP/job.json")"
          JOB_TOKEN="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$TMP/job.json")"
          echo "Production smoke job: ${JOB_ID:0:8}"

          STATUS=""
          BUILD=""
          for attempt in $(seq 1 80); do
            curl -fsS --retry 2 --retry-delay 2               -H "X-Job-Token: $JOB_TOKEN"               "$BASE_URL/api/jobs/$JOB_ID" > "$TMP/state.json"

            python - "$TMP/state.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          keys=["id","status","stage","progress","container_build_id","result_available","result_bytes","result_checksum_sha256","result_persist_source","result_persisted_at","review_detached_from_container","diagnostic_excerpt","error","result_sync_warning"]
          print(json.dumps({k:d.get(k) for k in keys}, ensure_ascii=False))
          PY

            STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$TMP/state.json")"
            BUILD="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("container_build_id",""))' "$TMP/state.json")"
            STAGE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("stage",""))' "$TMP/state.json")"
            DIAG="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(" ".join(str(d.get(k,"") or "") for k in ("error","diagnostic_excerpt","result_sync_warning")))' "$TMP/state.json")"

            if [[ "$STAGE" == "container_dispatch_failed" ]] || grep -q "Maximum number of running container instances exceeded" <<<"$DIAG"; then
              echo "R11b capacity recovery FAILED" >&2
              exit 21
            fi

            if [[ "$STATUS" == "review" || "$STATUS" == "done" || "$STATUS" == "failed" || "$STATUS" == "skipped" ]]; then
              break
            fi
            sleep 12
          done

          if [[ "$BUILD" != "result-persist-r11b" ]]; then
            echo "Unexpected processor build: $BUILD" >&2
            exit 22
          fi
          if [[ "$STATUS" == "failed" || -z "$STATUS" ]]; then
            echo "Production job did not complete successfully: status=$STATUS" >&2
            exit 23
          fi
          if [[ "$STATUS" == "review" ]]; then
            python - "$TMP/state.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          assert d.get("result_available") is True, d
          assert int(d.get("result_bytes") or 0) > 0, d
          assert d.get("result_persisted_at"), d
          assert d.get("result_persist_source") in {"container_push", "container_pull"}, d
          print("Durable R2 review result: PASSED")
          PY
            curl -fsS -X POST "$BASE_URL/api/jobs/$JOB_ID/decision"               -H "Content-Type: application/json"               -H "X-Job-Token: $JOB_TOKEN"               --data '{"action":"skip"}' > "$TMP/decision.json"
            python - "$TMP/decision.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          assert d.get("ok") is True, d
          assert (d.get("job") or {}).get("status") == "skipped", d
          print("Review release decision: PASSED")
          PY
          fi

          python - "$TMP/session.json" > "$TMP/end-payload.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          print(json.dumps({"session_id":d["id"],"session_token":d["token"]}))
          PY
          curl -fsS -X POST "$BASE_URL/api/session/end"             -H "Content-Type: application/json"             --data-binary @"$TMP/end-payload.json" > "$TMP/end.json" || true

          echo "R11b live production smoke: PASSED · status=$STATUS · processor=$BUILD · worker=$WORKER_BUILD"
