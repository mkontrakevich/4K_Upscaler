name: TECH MASTER V2 real RAW smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tech-master-v2-real-raw-smoke.yml'

permissions:
  contents: read

jobs:
  real-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAW_SHA256: 1b4344f4b8ca629830254850fbcbaf2931c83c00a158ab87d84e5ee7722046d5
      RAW_BUCKET: marins-tropicana-photo-originals
      RAW_KEY: originals/DSC09818.ARW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        run: |
          npm install
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5' 'tifffile>=2025.1,<2028' 'rawpy==0.28.0'
      - name: Download immutable real RAW
        run: |
          mkdir -p /tmp/tech-v2
          npx wrangler r2 object get "$RAW_BUCKET/$RAW_KEY" --file /tmp/tech-v2/source.ARW --remote
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path('/tmp/tech-v2/source.ARW')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          assert got==os.environ['RAW_SHA256'],(got,os.environ['RAW_SHA256'])
          print('RAW_SHA_PASS',got,p.stat().st_size)
          PY
      - name: Run active TECH MASTER V2
        run: |
          python scripts/editorial_raster_technical_master.py --input /tmp/tech-v2/source.ARW --out /tmp/tech-v2/out --job-id 22222222-2222-4222-8222-222222222222 --source-sha256 "$RAW_SHA256"
      - name: Verify active corrections
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          q=json.loads(Path('/tmp/tech-v2/out/qa.json').read_text())
          assert q['source_kind']=='CAMERA_RAW'
          assert q['technical_version']=='AUTO_TECH_MASTER_V2'
          assert q['qa_checks']['RAW_CAMERA_WB_APPLIED']=='PASS'
          assert q['base_color_management']['status']=='CAMERA_WB_APPLIED'
          assert q['auto_geometry_analysis']['analysis_proxy']['source_pixels_modified'] is False
          assert q['auto_geometry_analysis']['detected_line_count']>0,q['auto_geometry_analysis']
          assert q['master_bit_depth']==16
          assert q['HDR_applied'] is False and q['virtual_exposures'] is False and q['local_HDR'] is False
          assert q['generative_processing'] is False
          optics=q['auto_optics_correction']
          roll=q['auto_geometry_correction']
          perspective=q['auto_vertical_perspective_correction']
          photo=q['auto_photometric_correction']
          assert optics['engine']=='AUTO_PROFILED_OPTICS_V1'
          assert optics['status']=='APPLIED',optics
          assert optics['profile_id']=='SONY_FE1635F28GM_16MM_PTLENS_3RD_PARTY'
          assert optics['invalid_source_fraction']<=.00002
          assert roll['status'] in ('APPLIED','NO_CHANGE_NEEDED','HOLD')
          assert perspective['status']=='APPLIED',perspective
          assert abs(perspective['vertical_residual_after_deg'])<=.45
          assert perspective['crop_area_fraction']<=.23
          assert photo['status'] in ('APPLIED','NO_CHANGE_NEEDED','HOLD')
          assert photo['HDR_applied'] is False and photo['generative_processing'] is False
          master=Path('/tmp/tech-v2/out/master16.tif')
          assert hashlib.sha256(master.read_bytes()).hexdigest()==q['master_sha256']
          result={
            'result':'PASS','technical_version':q['technical_version'],
            'dimensions':[q['width'],q['height']],
            'master_bytes':q['master_bytes'],'master_sha256':q['master_sha256'],
            'optics':optics,'geometry_analysis':q['auto_geometry_analysis'],
            'roll':roll,'perspective':perspective,'photometry':photo,
            'base_color_management':q['base_color_management'],
            'qa_checks':q['qa_checks']
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
