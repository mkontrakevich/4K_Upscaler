name: Editorial DSC09818 native-resolution compare source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-raw-native-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == 'mkontrakevich/4K_Upscaler'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tools and validate script
        run: |
          npm ci || npm install
          python -m pip install --quiet numpy tifffile pillow
          python -m py_compile scripts/editorial_fullres_review.py
      - name: Fetch the approved source lineage from private R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          mkdir -p /tmp/editorial-fullres
          ROOT=marins-tropicana-editorial-photo/tropicana-park/DSC09818/technical-v9
          npx wrangler r2 object get "$ROOT/DSC09818_TECH_CLEAN16.tif" --file /tmp/editorial-fullres/technical16.tif --remote
          npx wrangler r2 object get "$ROOT/DSC09818_TECH_QA.json" --file /tmp/editorial-fullres/qa.json --remote
      - name: Create native 6536x4360 compare image without upscaling
        shell: bash
        run: |
          python scripts/editorial_fullres_review.py /tmp/editorial-fullres/technical16.tif /tmp/editorial-fullres/qa.json /tmp/editorial-fullres/fullsize.jpg /tmp/editorial-fullres/fullres-preview-manifest.json
      - name: Publish isolated immutable preview and manifest
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(python -c 'import json;print(json.load(open("/tmp/editorial-fullres/fullres-preview-manifest.json"))["preview_key"])')
          npx wrangler r2 object put "marins-tropicana-editorial-photo/$KEY" --file /tmp/editorial-fullres/fullsize.jpg --remote --content-type image/jpeg
          npx wrangler r2 object put "marins-tropicana-editorial-photo/tropicana-park/DSC09818/technical-v9/fullres-preview-manifest.json" --file /tmp/editorial-fullres/fullres-preview-manifest.json --remote --content-type application/json
      - name: Save small reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: tropicana-dsc09818-fullres-viewer-evidence
          path: /tmp/editorial-fullres/fullres-preview-manifest.json
          retention-days: 14
