name: Editorial Photo CI
on:
  pull_request:
    paths:
      - 'src/editorial_photo.js'
      - 'src/editorial_jobs.js'
      - 'tests/editorial-jobs.test.mjs'
      - 'tests/editorial-raster-tech.py'
      - 'scripts/editorial_raster_technical_master.py'
      - 'tests/editorial-auto-rework.py'
      - 'scripts/editorial_deterministic_correction.py'
      - 'requirements.txt'
      - 'tests/editorial-tech-runtime.py'
      - 'cloud_processor_service.py'
      - 'editorial_tech_service.py'
      - 'src/editorial_tech_workflow.js'
      - 'src/worker.js'
      - 'site/editorial-photo.html'
      - 'site/editorial-split.js'
      - 'tests/editorial-live-split.test.mjs'
      - 'tests/editorial-qa-layout.test.mjs'
      - 'site/editorial-import.js'
      - 'site/editorial-compare.js'
      - 'scripts/editorial_dsc09818_technical_master_v10.py'
      - 'scripts/editorial_fullres_review_v10.py'
      - '.github/workflows/editorial-photo-technical-v10.yml'
      - 'scripts/editorial_original_raw_review.py'
      - '.github/workflows/editorial-original-raw-review.yml'
      - 'site/editorial-compare.css'
      - 'scripts/editorial_fullres_review.py'
      - '.github/workflows/editorial-fullres-review.yml'
      - 'site/index.html'
      - 'wrangler.jsonc'
      - '.github/workflows/editorial-photo-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS modules
        run: |
          node --check src/worker.js
          node --check src/editorial_photo.js
          node --check src/editorial_jobs.js
          node --check src/editorial_tech_workflow.js
          python - <<'PY'
          from pathlib import Path
          code=Path('src/editorial_tech_workflow.js').read_text()
          assert 'new FixedLengthStream(expectedSize)' in code
          assert 'response.body.pipeTo(writable)' in code
          assert 'bucket.put(key,readable,options)' in code
          assert 'await Promise.all([copy,save])' in code
          assert 'persistKnownLength(env,output,master,qa.master_bytes' in code
          assert 'persistKnownLength(env,ROOT(id)+"technical/fullres-preview.jpg",view,qa.preview_bytes' in code
          assert '.put(output,master.body,' not in code
          print('Known-length R2 TIFF/preview stream regression guard: PASS')
          PY
          python - <<'PY'
          from pathlib import Path
          src=Path('src/editorial_tech_workflow.js').read_text()
          assert 'typeof event.payload==="string"?JSON.parse(event.payload)' in src
          assert 'const id=String(payload.job_id||"")' in src
          print('Cloudflare Workflow JSON string API input accepted')
          PY
          node --experimental-default-type=module --test tests/editorial-jobs.test.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('site/editorial-photo.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert blocks, 'No inline editorial UI script found'
          Path('/tmp/editorial-photo-inline.js').write_text('\\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/editorial-photo-inline.js
          node --test tests/editorial-qa-layout.test.mjs
          node --check site/editorial-split.js
          node --test tests/editorial-live-split.test.mjs
          python - <<'PY'
          from pathlib import Path
          page=Path('site/editorial-photo.html').read_text(encoding='utf-8')
          assert '[hidden]{display:none!important}' in page, 'hidden frame may bleed into empty UI'
          assert 'id="intake-progress" max="100" value="0" hidden' in page, 'empty progress must not animate'
          assert 'bar.value=0;bar.hidden=true;' in page
          assert 'const recent=recentAuthorizedJob();' in page
          assert 'if(recent)activateIntake(recent);' in page
          assert 'jobToken(last)' in page, 'never auto restore unauthenticated jobs'
          assert 'id="intake-empty"' in page
          print('Editorial empty state and job restoration safeguards: PASS')
          PY
          node --check site/editorial-compare.js
          node --check site/editorial-import.js
          python -m py_compile editorial_tech_service.py cloud_processor_service.py scripts/editorial_raster_technical_master.py scripts/editorial_deterministic_correction.py
          python -m py_compile scripts/editorial_fullres_review.py scripts/editorial_original_raw_review.py scripts/editorial_dsc09818_technical_master_v10.py scripts/editorial_fullres_review_v10.py
      - name: Test generic raster Tech Master (no HDR, real TIFF)
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5' 'tifffile>=2025.1,<2028'
          python tests/editorial-raster-tech.py
          python tests/editorial-tech-runtime.py
          python tests/editorial-auto-rework.py
      - name: Validate geometry module
        run: |
          python -m py_compile editorial_geometry.py editorial_lens_profile.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('editorial_geometry.py').read_text()
          assert 'USAC_MAGSAC' in p
          assert 'FRAME="DSC09818"' in p
          assert 'geometry_status' in p
          assert '.015' in p
          assert 'perspective' in Path('src/editorial_photo.js').read_text().lower()
          lens=Path('editorial_lens_profile.py').read_text()
          assert 'PTLens' in lens and 'ExifTag' in lens
          stage=Path('.github/workflows/editorial-photo-stage.yml').read_text()
          assert stage.index('editorial_lens_profile.py correct')<stage.index('editorial_geometry.py prepare')
          assert 'tifffile' in stage and 'optically_locked_model_input.jpg' in stage
          PY
      - name: Validate architecture and safety
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          c=json.loads(Path('wrangler.jsonc').read_text())
          assert any(x.get('bucket_name')=='marins-tropicana-editorial-photo' and x.get('binding')=='TROPICANA_EDITORIAL_R2' for x in c['r2_buckets'])
          assert any(x.get('name')=='mg4k-tropicana-editorial' for x in c['workflows'])
          s=Path('src/editorial_photo.js').read_text()
          assert 'input_references' in s and '/images' in s
          assert 'EDITORIAL_REVIEW' in s and 'final:false' in s
          assert 'technical_v10_neutral_source_required' in s
          assert 'technical_v10_HOLDS_or_HDR_detected' in s
          assert 'technical_v10_human_QA_approval_required' in s
          assert 'technical_v10_approval_or_sha_invalid' in s
          assert 'editorial_model_input_sha_mismatch' in s
          assert 'technical-v10/DSC09818_TECH_QA.json' in s
          assert 'technical-v10/DSC09818_TECH_CLEAN16.tif' in s
          assert 'tech_v10_full' in s and 'technical_v10_preview' in s
          neutral=Path('scripts/editorial_dsc09818_technical_master_v10.py').read_text()
          assert 'def neutral_tone' in neutral and 'develop_neutral()' in neutral
          assert "HDR_applied=False" in neutral and "virtual_exposures=False" in neutral
          assert "qa_checks={'raw_sha':'PASS'" in neutral
          assert not any(x in neutral for x in ("def smooth(","develop('fusion')","HDR_TEST.jpg"))
          assert 'id="tech-hdr"' not in Path('site/editorial-photo.html').read_text()
          assert 'technicalV10' in Path('site/editorial-compare.js').read_text()
          workflow10=Path('.github/workflows/editorial-photo-technical-v10.yml').read_text()
          assert 'technical-v10' in workflow10 and 'HDR_ABSENT' in workflow10
          assert 'DSC09818_TECH_HDR_TEST.jpg' not in workflow10
          assert 'HDR_applied' in s and 'human_QA_approved' in s
          assert 'WorkflowEntrypoint' in s
          assert 'NonRetryableError' in s and 'retries:{limit:0}' not in s
          assert 'TROPICANA_EDITORIAL_R2' in s
          ui=Path('site/editorial-photo.html').read_text()
          assert 'Editorial Photo' in ui and '/api/editorial' in ui
          assert 'editorial-photo.html' in Path('site/index.html').read_text()
          compare=Path('site/editorial-compare.js').read_text()
          assert 'drawImage' in compare and 'pointerDown' in compare and 'pointerMove' in compare
          assert 'data-ec-mode="split"' in compare and 'data-ec-zoom="editorial"' in compare
          assert 'ec-dialog' in compare and 'requestFullscreen' in compare
          assert 'compare_info' in s and 'tech_full' in s
          assert 'raw_original' in s and 'original-raw-manifest.json' in s
          assert 'fullres-neutral-' in s and 'q.source_sha256' in s
          assert 'data-ec-pair="raw-tech"' in compare and 'data-ec-pair="tech-editorial"' in compare
          assert 'reference_center_crop_xywh' in compare and 'img===S.images.raw' in compare
          assert 'S.pair==="raw-tech"' in compare and 'applyPair()' in compare
          assert 'open-editorial' in ui and 'SPLIT · RAW / TECH' in ui
          raw=Path('scripts/editorial_original_raw_review.py').read_text()
          assert 'optical_distortion_corrected=False' in raw and 'perspective_corrected=False' in raw
          assert 'HDR_applied=False' in raw and 'no_spatial_resize=True' in raw
          assert 'rawpy.imread' in raw and 'SOURCE_SHA=' in raw
          workflow=Path('.github/workflows/editorial-original-raw-review.yml').read_text()
          assert 'DSC09818.ARW' in workflow and 'editorial_original_raw_review.py' in workflow
          assert 'openrouter' not in workflow.lower()
          assert 'technical_master_sha256' in s and 'fullres-preview-manifest.json' in s
          assert 'editorial-compare.js' in ui and 'id="open-compare"' in ui
          assert 'technical-v9' in Path('.github/workflows/editorial-fullres-review.yml').read_text() and 'DSC09818_TECH_CLEAN16.tif' in Path('.github/workflows/editorial-fullres-review.yml').read_text()
          assert 'qa["clean16_sha256"]' in Path('scripts/editorial_fullres_review.py').read_text()
          print('Editorial Photo contract: PASSED')
          PY
      - name: Build Worker without deployment
        run: |
          npm ci || npm install
          npx wrangler deploy --dry-run --outdir /tmp/mg4k-editorial-dry-run --config wrangler.jsonc
